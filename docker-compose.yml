services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: simple_ab_testing
      POSTGRES_USER: simple_ab_testing_user
      POSTGRES_PASSWORD: simple_ab_testing_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_ab_testing_user -d simple_ab_testing"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "0.50"

  lander:
    build:
      context: ./lander
    ports:
      - "8080:80"
  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    volumes:
      - ./sdk/dist:/app/sdk/dist
    environment:
      DATABASE_URL: postgresql://simple_ab_testing_user:simple_ab_testing_password@postgres:5432/simple_ab_testing
    depends_on:
      postgres:
        condition: service_healthy
  demo:
    build:
      context: ./demo
    ports:
      - "8082:80"

volumes:
  postgres_data:
