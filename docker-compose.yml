services:
  lander:
    build:
      context: ./lander
    ports:
      - "8080:80"
  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    volumes:
      - ./sdk/dist:/app/sdk/dist
  demo:
    build:
      context: ./demo
    ports:
      - "8082:80"
